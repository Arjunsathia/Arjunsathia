name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # The "output" branch holds only the snake images, not the site, so Vercel must not try to build it (it would
      # fail with "vite: command not found", exit 127). This vercel.json in that branch turns its deployments off.
      - name: Keep Vercel from deploying the output branch
        run: echo '{"git":{"deploymentEnabled":false}}' > dist/vercel.json

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
