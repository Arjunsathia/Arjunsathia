<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-label="about me — who I am"><title>about me — who I am</title><style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .card{fill:#ffffff;stroke:#d0d7de} .inner{fill:#f6f8fa;stroke:#d0d7de} .bar{fill:#f6f8fa}
  .fg{fill:#1f2328} .muted{fill:#59636e} .faint{fill:#818b98} .line{stroke:#d0d7de}
  .blue{fill:#0969da} .purple{fill:#8250df} .green{fill:#1a7f37} .orange{fill:#bc4c00} .pink{fill:#bf3989}
  .s-blue{stroke:#0969da} .s-purple{stroke:#8250df} .s-green{stroke:#1a7f37} .s-muted{stroke:#d0d7de}
  .glow-blue{fill:#54aeff} .glow-purple{fill:#c297ff} .glow-green{fill:#4ac26b}
  .pill{fill:#dafbe1;stroke:#4ac26b} .bubble-in{fill:#ffffff;stroke:#d0d7de} .bubble-out{fill:#1a7f37}
  .on-accent{fill:#ffffff} .grid{stroke:#d0d7de}
  @media (prefers-color-scheme: dark){
    .card{fill:#0d1117;stroke:#30363d} .inner{fill:#161b22;stroke:#30363d} .bar{fill:#161b22}
    .fg{fill:#e6edf3} .muted{fill:#9198a1} .faint{fill:#6e7681} .line{stroke:#30363d}
    .blue{fill:#4493f8} .purple{fill:#ab7df8} .green{fill:#3fb950} .orange{fill:#f0883e} .pink{fill:#db61a2}
    .s-blue{stroke:#4493f8} .s-purple{stroke:#ab7df8} .s-green{stroke:#3fb950} .s-muted{stroke:#30363d}
    .glow-blue{fill:#1f6feb} .glow-purple{fill:#8957e5} .glow-green{fill:#238636}
    .pill{fill:#0f2a1a;stroke:#238636} .bubble-in{fill:#21262d;stroke:#30363d} .bubble-out{fill:#238636}
    .grid{stroke:#21262d}
  }
  
</style>
  <defs><clipPath id="type"><rect x="46" y="0" width="0" height="60"><animate attributeName="width" values="0;18;36;54;72;90;108;126;144;162;180" dur="0.70s" begin=".2s" fill="freeze" calcMode="discrete"/></rect></clipPath>
  <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#4493f8"/><stop offset=".5" stop-color="#ab7df8" stop-opacity=".7"/><stop offset="1" stop-color="#ab7df8" stop-opacity="0"/></linearGradient></defs>
  <text x="0" y="40" class="mono faint" font-size="15">01</text>
  <text x="46" y="42" class="mono blue" font-size="30" font-weight="700" textLength="180" lengthAdjust="spacingAndGlyphs" clip-path="url(#type)">&gt; about_me</text>
  <rect x="232" y="17" width="13" height="30" class="blue" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" begin=".2s" repeatCount="indefinite"/></rect>
  <text x="900" y="40" text-anchor="end" class="mono faint" font-size="15" opacity="0">// who I am<animate attributeName="opacity" from="0" to="1" begin="1.00s" dur=".5s" fill="freeze"/></text>
  <rect x="0" y="64" height="2" width="0" rx="1" fill="url(#rule)"><animate attributeName="width" from="0" to="900" begin=".2s" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect></svg>
