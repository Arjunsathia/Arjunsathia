<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="Arjun Sathia — Full-Stack Developer at Wisbato, building CRM and fintech platforms"><title>Arjun Sathia — Full-Stack Developer at Wisbato, building CRM and fintech platforms</title><style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
