    <g><circle cx="1000" cy="172" r="88" fill="none" class="s-muted" stroke-width="1.5" stroke-dasharray="4 7"/><circle cx="1088.0" cy="172.0" r="8" fill="#61dafb"/><circle cx="956.0" cy="248.2" r="7" fill="#ab7df8"/><circle cx="956.0" cy="95.8" r="8" fill="#47a248"/><animateTransform attributeName="transform" type="rotate" from="0 1000 172" to="360 1000 172" dur="24s" repeatCount="indefinite"/></g>
    <circle cx="1000" cy="172" r="46" class="inner" stroke-width="1.5"/>
    <text x="1000" y="181" text-anchor="middle" class="mono blue" font-size="26" font-weight="700">&lt;/&gt;</text>
