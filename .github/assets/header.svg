    <rect x="72" y="44" width="176" height="34" rx="17" class="pill" stroke-width="1"/>
    <circle cx="94" cy="61" r="5" class="green"><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.45;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="108" y="66" class="sans green" font-size="15" font-weight="600">Open to work</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.15s" dur=".6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/><text x="70" y="160" class="sans fg" font-size="78" font-weight="700" letter-spacing="-2">Arjun Sathia</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.3s" dur=".6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/><text x="72" y="206" class="sans muted" font-size="26">Full-Stack Developer <tspan class="faint">·</tspan> CRM &amp; Fintech Systems</text></g>
  <text x="72" y="262" class="mono blue" font-size="21" opacity="0"><tspan class="faint">&gt; </tspan>building production CRMs and fintech platforms<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.33;1" dur="12s" begin="1s" repeatCount="indefinite"/></text><text x="72" y="262" class="mono blue" font-size="21" opacity="0"><tspan class="faint">&gt; </tspan>integrating WhatsApp Cloud API &amp; MetaTrader 5<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.33;1" dur="12s" begin="5s" repeatCount="indefinite"/></text><text x="72" y="262" class="mono blue" font-size="21" opacity="0"><tspan class="faint">&gt; </tspan>money and messages that stay correct under load<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.33;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.5s" dur=".6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/><text x="72" y="306" class="mono faint" font-size="17">Kozhikode, India  ·  React · Next.js · Node.js · PostgreSQL · MongoDB</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" begin="0.4s" dur=".6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
