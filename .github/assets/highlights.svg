<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="Highlights: 300+ automated tests; 3 client companies; planner payload cut from about 320 KB to about 37 KB; 12 by 7 permission matrix; 60+ SQL migrations."><title>Highlights: 300+ automated tests; 3 client companies; planner payload cut from about 320 KB to about 37 KB; 12 by 7 permission matrix; 60+ SQL migrations.</title><style>
