  <text x="600" y="58" text-anchor="middle" class="sans fg" font-size="24" font-weight="600">Thanks for stopping by.</text>
  <text x="600" y="88" text-anchor="middle" class="mono muted" font-size="15">Let's build something reliable together.</text></svg>
