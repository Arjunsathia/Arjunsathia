<svg xmlns="http://www.w3.org/2000/svg" width="800" height="96" viewBox="0 0 800 96" role="img" aria-label="Experience — where I've worked"><title>Experience — where I've worked</title><style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .card{fill:#ffffff;stroke:#d0d7de} .inner{fill:#f6f8fa;stroke:#d0d7de}
  .fg{fill:#1f2328} .muted{fill:#59636e} .faint{fill:#818b98}
  .blue{fill:#0969da} .purple{fill:#8250df} .green{fill:#1a7f37}
  .s-blue{stroke:#0969da} .s-muted{stroke:#d0d7de} .dot{fill:#d0d7de}
  .glow-blue{fill:#54aeff} .glow-purple{fill:#c297ff} .glow-green{fill:#4ac26b}
  .pill{fill:#dafbe1;stroke:#4ac26b} .bubble-in{fill:#ffffff;stroke:#d0d7de} .bubble-out{fill:#1a7f37} .on-accent{fill:#ffffff}
  .stop-a{stop-color:#0969da} .stop-b{stop-color:#8250df}
  @media (prefers-color-scheme: dark){
    .card{fill:#0d1117;stroke:#30363d} .inner{fill:#161b22;stroke:#30363d}
    .fg{fill:#e6edf3} .muted{fill:#9198a1} .faint{fill:#6e7681}
    .blue{fill:#4493f8} .purple{fill:#ab7df8} .green{fill:#3fb950}
    .s-blue{stroke:#4493f8} .s-muted{stroke:#30363d} .dot{fill:#30363d}
    .glow-blue{fill:#1f6feb} .glow-purple{fill:#8957e5} .glow-green{fill:#238636}
    .pill{fill:#0f2a1a;stroke:#238636} .bubble-in{fill:#21262d;stroke:#30363d} .bubble-out{fill:#238636}
    .stop-a{stop-color:#4493f8} .stop-b{stop-color:#ab7df8}
  }
</style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="stop-a"/><stop offset="1" class="stop-b"/></linearGradient>
    <linearGradient id="rule" x1="0" x2="1"><stop offset="0" class="stop-a"/><stop offset=".6" class="stop-b" stop-opacity=".5"/><stop offset="1" class="stop-b" stop-opacity="0"/></linearGradient>
    <linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" begin="0s" dur="0.6s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1" keyTimes="0;1"/>
    <rect x="2" y="14" width="62" height="62" rx="18" fill="url(#tile)"/>
    <text x="33" y="55" text-anchor="middle" class="sans on-accent" font-size="26" font-weight="700">04</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" begin="0.15s" dur="0.8s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1" keyTimes="0;1"/><text x="86" y="60" class="sans fg" font-size="44" font-weight="700" letter-spacing="-1">Experience</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="16 0" to="0 0" begin="0.45s" dur="0.8s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1" keyTimes="0;1"/><text x="798" y="56" text-anchor="end" class="mono faint" font-size="24">where I've worked</text></g>
  <rect x="0" y="90" height="3" width="0" rx="1.5" fill="url(#rule)"><animate attributeName="width" from="0" to="800" begin=".2s" dur="1.4s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1" keyTimes="0;1"/></rect>
  <rect x="-160" y="90" width="160" height="3" fill="url(#spark)" opacity=".7"><animate attributeName="x" values="-160;800;800" keyTimes="0;.45;1" dur="5s" begin="1.6s" repeatCount="indefinite"/></rect></svg>
